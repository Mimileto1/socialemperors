<!DOCTYPE html>
<html lang="es">
	<head>
		<!-- Meta -->
		<meta charset="utf-8"/>
		<!-- Title and Icon -->
		<title id="pageTitle">Social Empires</title>
		<link rel="shortcut icon" href="img/icon.gif"/>
		<link rel="icon" type="image/png" href="img/icon.gif"/>
		<!-- CSS -->
		<link rel="stylesheet" href="css/facebook.css"/>
	</head>
	<body class="ego_wide canvas center_fixed_width_app fbx UIPage_LoggedOut liquid hideBanner Locale_es_LA" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); overflow: auto;">
		<center><img src="img/logo.png" style="width: 200px;"/></center>
		<div class="mvl ptm uiInterstitial canvas_error_page uiInterstitialLarge uiBoxWhite">
			<!-- HEAD TITLE -->
			<div class="uiHeader uiHeaderBottomBorder mhl mts uiHeaderPage interstitialHeader">
				<div class="clearfix uiHeaderTop">
					<div>
						<img src="img/sword.png" height="18px" style="margin-left: 5px;">
						<h2 class="uiHeaderTitle" aria-hidden="true" style="margin-left: 2px; display: inline-block;">
							<a href="/" style="text-decoration: none;">Social Empires </a>
						</h2>
						<p style="display: inline-block; margin: 0 0 4px 6px;">Por el equipo Social Emperors ~ {{ version | default("?")}}</p>
					</div>
				</div>
			</div>
			<!-- SIGNUP CONTENT -->
<div class="phl ptm uiInterstitialContent" style="overflow: auto; display: inblock;">
    <br>
    <div style="margin-left:20px; font-size:13px; float: left;">
        <b>Crear cuenta</b>
        <br><br>
        {% if error %}<span style="color:#c0392b; font-weight:bold;">{{ error }}</span><br><br>{% endif %}
        <form method="post" action="/signup">
            <div style="float: left; margin-right: 4px;"><img src="img/villager.png" style="height: 27px;"></div>
            <div style="float: left;">
                <input type="text" name="username" placeholder="Usuario (3-20 letras/n&uacute;meros)" style="height: 24px; min-width: 330px;" required maxlength="20" autocomplete="username">
            </div>
            <br><br>
            <div style="float: left; margin-right: 4px;"><img src="img/knight.png" style="height: 27px;"></div>
            <div style="float: left;">
                <input type="password" name="password" placeholder="Contrase&ntilde;a (m&iacute;nimo 6)" style="height: 24px; min-width: 330px;" required minlength="6" autocomplete="new-password">
            </div>
            <br><br>
            <div style="float: left; margin-right: 4px;"><img src="img/villager.png" style="height: 27px;"></div>
            <div style="float: left;">
                <input type="password" name="confirm" placeholder="Repite la contrase&ntilde;a" style="height: 24px; min-width: 330px;" required minlength="6" autocomplete="new-password">
            </div>
            <br><br>
            <button type="submit" style="font-size:14px; height: 25px">Crear cuenta</button>
            &nbsp;&nbsp;&nbsp; <a href="/"><b>Ya tengo cuenta</b></a>
        </form>
    </div>
</div>
</body>
</html>
